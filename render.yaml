services:
  - type: web
    name: archive-workbench-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: APP_ACCESS_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
